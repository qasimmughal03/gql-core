name: Publish GQL-Core Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Repository (testpypi or pypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build distributions and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target_repo == 'testpypi' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to Production PyPI
        if: ${{ github.event.inputs.target_repo == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
