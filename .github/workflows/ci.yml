name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Gate A: Package Matrix (Python 3.11, 3.12, 3.13)
  # -------------------------------------------------------------
  package-matrix:
    name: Package & Isolated Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Wheel contains only the gql_core package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          top = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          extra = {t for t in top if t != "gql_core" and not t.endswith(".dist-info")}
          assert not extra, f"unexpected top-level entries in {wheel}: {sorted(extra)}"
          print("wheel top level:", sorted(top))
          PY

      - name: Verify isolated wheel installation and out-of-tree execution
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(find dist -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/gql-wheel-venv"
          "$RUNNER_TEMP/gql-wheel-venv/bin/python" -m pip install "$WHEEL"

          # Execute from outside checkout directory to ensure zero source-tree reliance
          cd "$RUNNER_TEMP"

          # 1. Verify site-packages import and version
          "$RUNNER_TEMP/gql-wheel-venv/bin/python" -c "
          import gql_core
          from gql_core import PropertyGraph, Node, Edge, run, PlanBuilder, eq, lit, prop, execute_plan
          assert 'site-packages' in gql_core.__file__, f'Not from site-packages: {gql_core.__file__}'
          from importlib.metadata import version
          assert gql_core.__version__ == version('gql-core'), (gql_core.__version__, version('gql-core'))

          # Test textual query
          g = PropertyGraph()
          g.add_node(Node('n', 'Person', {'name': 'Alice'}))
          res = run('MATCH (n:Person) RETURN n.name AS name', g)
          assert res == [{'name': 'Alice'}], res

          # Test typed plan
          plan = PlanBuilder.scan('p', 'Person').project((prop('p', 'name'), 'name')).build()
          plan_res = execute_plan(plan, g)['rows']
          assert plan_res == [{'name': 'Alice'}], plan_res
          print('Isolated wheel smoke test passed on Python', gql_core.__version__)
          "

          # 2. Verify CLI commands
          "$RUNNER_TEMP/gql-wheel-venv/bin/gql-core" --version
          "$RUNNER_TEMP/gql-wheel-venv/bin/gql-core" version

  # -------------------------------------------------------------
  # Gate B: Complete Unit and Regression Suite
  # -------------------------------------------------------------
  unit-tests:
    name: Unit & Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fetch pinned openCypher TCK feature fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark/cache
          git clone --depth 1 --branch 2024.3 https://github.com/opencypher/openCypher.git benchmark/cache/openCypher
          test -d benchmark/cache/openCypher/tck/features

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full unit & regression suite
        run: python -m pytest tests/ -v

  # -------------------------------------------------------------
  # Gate C: Strict openCypher TCK Verification
  # -------------------------------------------------------------
  tck-verification:
    name: Strict openCypher TCK Conformance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch pinned openCypher TCK corpus (2024.3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark/cache
          git clone --depth 1 --branch 2024.3 https://github.com/opencypher/openCypher.git benchmark/cache/openCypher
          test -d benchmark/cache/openCypher/tck/features

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run strict TCK verification harness
        run: python -m benchmark.tck.runner

      - name: Validate TCK release acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("benchmark/results/tck_compatibility_results.json", encoding="utf-8") as f:
              s = json.load(f)["metadata"]["strict_mode"]
          for key in ("total_scenarios", "supported_scenarios", "PASS_RESULT", "PASS_EXPECTED_ERROR",
                      "FAIL_WRONG_RESULT", "FAIL_COMPILE", "FAIL_RUNTIME", "failed_side_effect_checks",
                      "wrong_error_categories", "BLOCKED", "UNSUPPORTED", "pass_rate_supported_pct"):
              print(f"{key}: {s[key]}")
          assert s["total_scenarios"] == 3897, s["total_scenarios"]
          assert s["supported_scenarios"] == 3879, s["supported_scenarios"]
          assert s["UNSUPPORTED"] == 18, s["UNSUPPORTED"]
          assert s["BLOCKED"] == 0, s["BLOCKED"]
          for key in ("FAIL_WRONG_RESULT", "FAIL_COMPILE", "FAIL_RUNTIME",
                      "failed_side_effect_checks", "wrong_error_categories"):
              assert s[key] == 0, (key, s[key])
          assert s["PASS_RESULT"] + s["PASS_EXPECTED_ERROR"] == s["supported_scenarios"]
          assert s["pass_rate_supported_pct"] == 100.0, s["pass_rate_supported_pct"]
          print("TCK gate passed: every supported scenario passes.")
          PY

      - name: Upload machine-readable TCK results artifact
        uses: actions/upload-artifact@v4
        with:
          name: tck-compatibility-results
          path: benchmark/results/tck_compatibility_results.json
          retention-days: 30

  reference-app:
    name: Reference App on the Published Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apps/service-impact with its pinned gql-core from PyPI
        run: |
          python -m venv /tmp/app-venv
          /tmp/app-venv/bin/python -m pip install --upgrade pip
          /tmp/app-venv/bin/python -m pip install "./apps/service-impact[test]"

      - name: Run the application's integration tests outside the checkout's package
        working-directory: apps/service-impact
        run: |
          /tmp/app-venv/bin/service-impact version
          /tmp/app-venv/bin/pytest -q -p no:cacheprovider
