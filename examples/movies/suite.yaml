name: movie-graph-benchmark
description: 'Comprehensive benchmark over a 159-node / 240-edge movie knowledge graph. Covers all 9 GQL-Core query classes:
  simple lookup, aggregation, multi-hop, multi-pattern, undirected, RPQ, RPQ+filter, negation, and hard/compound. Expected
  answers verified against IMDb/Wikipedia.'
queries:
- name: MQ01_total_movies
  purpose: Count all Movie nodes
  query_class: simple_lookup
  gql: MATCH (m:Movie) RETURN COUNT(m) AS count
  key_columns:
  - count
  expected:
  - - 46
- name: MQ02_total_people
  purpose: Count all Person nodes
  query_class: simple_lookup
  gql: MATCH (p:Person) RETURN COUNT(p) AS count
  key_columns:
  - count
  expected:
  - - 101
- name: MQ03_total_genres
  purpose: Count all Genre nodes
  query_class: simple_lookup
  gql: MATCH (g:Genre) RETURN COUNT(g) AS count
  key_columns:
  - count
  expected:
  - - 12
- name: MQ04_people_born_after_1990
  purpose: Filter people by birth year
  query_class: simple_lookup
  gql: 'MATCH (p:Person)

    WHERE p.born >= 1990

    RETURN COUNT(p) AS count

    '
  key_columns:
  - count
  expected:
  - - 7
- name: MQ05_actors_by_movie_count
  purpose: Top 5 most prolific actors by number of movies
  query_class: aggregation
  gql: 'MATCH (p:Person)-[:ACTED_IN]->(m:Movie)

    RETURN p.name AS actor, COUNT(m) AS movie_count

    ORDER BY movie_count DESC, actor ASC

    LIMIT 5

    '
  key_columns:
  - actor
  - movie_count
  expected:
  - - Leonardo DiCaprio
    - 6
  - - Matt Damon
    - 4
  - - Michael Caine
    - 4
  - - Tom Hardy
    - 4
  - - Morgan Freeman
    - 3
- name: MQ06_biggest_budget
  purpose: Movies with the biggest budgets
  query_class: aggregation
  gql: 'MATCH (m:Movie)

    RETURN m.title AS title, m.budget AS budget

    ORDER BY budget DESC

    LIMIT 3

    '
  key_columns:
  - title
  - budget
  expected:
  - - The Dark Knight
    - 185000000
  - - Dune
    - 165000000
  - - Interstellar
    - 165000000
- name: MQ07_highest_revenue
  purpose: Movies with highest box office revenue
  query_class: aggregation
  gql: 'MATCH (m:Movie)

    RETURN m.title AS title, m.revenue AS revenue

    ORDER BY revenue DESC

    LIMIT 3

    '
  key_columns:
  - title
  - revenue
  expected:
  - - Barbie
    - 1446000000
  - - Joker
    - 1074000000
  - - The Dark Knight
    - 1006000000
- name: MQ08_average_budget_by_decade
  purpose: AVG budget for movies made in the 1990s vs 2010s
  query_class: aggregation
  gql: 'MATCH (m:Movie)

    WHERE m.year >= 2010 AND m.year < 2020

    RETURN COUNT(m) AS count, AVG(m.budget) AS avg_budget

    '
  key_columns:
  - count
  - avg_budget
  expected:
  - - 18
    - 73655555.55555555
- name: MQ09_dicaprio_directors
  purpose: Find directors who directed Leonardo DiCaprio (2-hop)
  query_class: multi_hop
  gql: 'MATCH (p:Person)-[:ACTED_IN]->(m:Movie)<-[:DIRECTED]-(d:Person)

    WHERE p.name = "Leonardo DiCaprio"

    RETURN d.name AS director, COUNT(m) AS collaborations

    ORDER BY collaborations DESC, director ASC

    '
  key_columns:
  - director
  - collaborations
  expected:
  - - Martin Scorsese
    - 2
  - - Christopher Nolan
    - 1
  - - Quentin Tarantino
    - 1
  - - Steven Spielberg
    - 1
