name: Release

# Pushing a tag vX.Y.Z... builds, tests and publishes that version to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
# The publish job runs in the "pypi" environment; give that environment required
# reviewers in Settings -> Environments so each release waits for an approval.
# One-time setup is described in docs/PACKAGING.md ("Trusted Publishing").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish a manual run"
        required: true
        default: testpypi
        type: choice
        options: [testpypi]

permissions:
  contents: read

jobs:
  ci:
    name: Tests and TCK gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Tag matches the package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('gql_core/__init__.py').read()).group(1))")
          echo "tag=${GITHUB_REF_NAME} pyproject=${version} __init__=${init}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${init}" = "${version}"
          test -f "docs/RELEASE_NOTES_${version}.md"
          grep -q "^## \[${version}\]" CHANGELOG.md

      - name: Record SHA-256 of the distributions
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gql-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Keep only the distributions
        run: rm dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gql-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Keep only the distributions
        run: rm dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release with notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "GQL-Core ${version}" \
            --notes-file "docs/RELEASE_NOTES_${version}.md" \
            --prerelease
