- name: MQ11_genres_of_dicaprio
  purpose: What genres has Leonardo DiCaprio appeared in- (3-hop)
  query_class: multi_hop
  gql: 'MATCH (p:Person)-[:ACTED_IN]->(m:Movie)-[:IN_GENRE]->(g:Genre)

    WHERE p.name = "Leonardo DiCaprio"

    RETURN g.name AS genre, COUNT(m) AS movie_count

    ORDER BY movie_count DESC, genre ASC

    '
  key_columns:
  - genre
  - movie_count
  expected:
  - - Drama
    - 4
  - - Crime
    - 3
  - - Thriller
    - 2
  - - Action
    - 1
  - - Comedy
    - 1
  - - Science Fiction
    - 1
  - - Western
    - 1
