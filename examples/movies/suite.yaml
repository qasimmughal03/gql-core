- name: MQ35_nolan_vs_tarantino_actors
  purpose: Total actors who worked with Nolan OR Tarantino
  query_class: multi_pattern
  gql: 'MATCH (a:Person)-[:ACTED_IN]->(m:Movie)<-[:DIRECTED]-(d:Person)

    WHERE d.name = "Christopher Nolan" OR d.name = "Quentin Tarantino"

    RETURN d.name AS director, COUNT(a) AS actor_count

