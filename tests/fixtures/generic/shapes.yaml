# Minimal test ontology for generic pipeline verification.
nodes:
  Person:
    required: [id, name]
    optional: [age, city]
    types:
      id: str
      name: str
      age: int
      city: str

  City:
    required: [id, name]
    optional: [country]
    types:
      id: str
      name: str
      country: str

edges:
  KNOWS:
    src: Person
    dst: Person
    undirected: true
    properties:
      since: int

  LIVES_IN:
    src: Person
    dst: City
    properties: {}
