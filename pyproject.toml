[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gql-core"
version = "0.2.0"
description = "Generic property-graph query engine with formal GQL grammar and benchmark framework"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "lark>=1.2.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "networkx>=3.0",
]
benchmark = [
    "zstandard>=0.23.0",
    "psutil>=5.9.0",
]

[project.scripts]
gql-core = "gql_core.cli:main"

[tool.setuptools]
packages = [
    "gql_core",
    "gql_core.query",
    "ingestion",
    "graph",
    "query",
    "benchmark",
]

[tool.setuptools.package-data]
"gql_core.query" = ["grammar.lark"]
"gql_core" = ["query/grammar.lark"]
"query" = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
