[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "service-impact"
version = "0.1.0"
description = "Reference application: service dependency and impact analysis on GQL-Core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Pinned to the published release this application was verified against.
dependencies = ["gql-core==0.2.0a4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
service-impact = "service_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
service_impact = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
