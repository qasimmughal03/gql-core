[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-kg"
version = "0.1.0"
description = "Property Graph + formal query (GQL-Core subset) over cricsheet.org cricket data"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "lark==1.2.2",
    "pyyaml==6.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-cov==5.0.0",
]

[tool.setuptools]
packages = ["ingestion", "graph", "query", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
