name: Package check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Isolated wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(find dist -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/gql-wheel-venv"
          "$RUNNER_TEMP/gql-wheel-venv/bin/python" -m pip install "$WHEEL"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gql-wheel-venv/bin/python" -c "import gql_core; from gql_core import PropertyGraph,Node,run; assert 'site-packages' in gql_core.__file__; g=PropertyGraph(); g.add_node(Node('n','Test',{'value':'ok'})); assert run('MATCH (n:Test) RETURN n.value AS value',g)==[{'value':'ok'}]; print(gql_core.__version__)"
          "$RUNNER_TEMP/gql-wheel-venv/bin/gql-core" --version
